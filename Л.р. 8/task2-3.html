<!DOCTYPE html>
<html>
<head>
    <title>Завдання 2-3</title>
    <style>
        body {
            margin: 0;
            background-color: #f1f5f9;
            font-family: Arial, sans-serif;
        }

        header {
            background-color: #1b263b;
            color: #ffffff;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

            header h2 {
                margin: 0;
                font-size: 22px;
            }

        nav a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
        }

            nav a:hover {
                color: #f59e0b;
            }

        .slider {
            max-width: 100%;
            position: relative;
            margin: auto;
            height: 420px;
        }

            .slider .item img {
                object-fit: cover;
                width: 100%;
                height: 420px;
                filter: brightness(75%);
                border: none !important;
                box-shadow: none !important;
            }

            .slider .prev, .slider .next {
                cursor: pointer;
                position: absolute;
                top: 50%;
                width: auto;
                margin-top: -24px;
                padding: 16px;
                color: #ffffff;
                font-weight: bold;
                font-size: 20px;
                background-color: rgba(27, 38, 59, 0.65);
                transition: 0.4s ease;
            }

            .slider .next {
                right: 0;
            }

                .slider .prev:hover,
                .slider .next:hover {
                    background-color: #f59e0b;
                    color: #1b263b;
                }

        .slideText {
            position: absolute;
            color: #ffffff;
            font-size: 32px;
            font-weight: bold;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            padding: 14px 28px;
            background-color: rgba(27, 38, 59, 0.8);
            border-radius: 6px;
            text-align: center;
            text-shadow: 1px 1px 2px #000;
        }

        .slider-dots {
            position: absolute;
            bottom: 18px;
            width: 100%;
            text-align: center;
        }

        .slider-dots_item {
            cursor: pointer;
            height: 4px;
            width: 34px;
            margin: 0 4px;
            background-color: rgba(255, 255, 255, 0.45);
            display: inline-block;
            transition: background-color 0.4s ease;
        }

            .active,
            .slider-dots_item:hover {
                background-color: #f59e0b;
            }

        .slider .item {
            -webkit-animation-name: fade;
            -webkit-animation-duration: 1.5s;
            animation-name: fade;
            animation-duration: 1.5s;
        }

        @-webkit-keyframes fade {
            from {
                opacity: .4
            }

            to {
                opacity: 1
            }
        }

        @keyframes fade {
            from {
                opacity: .4
            }

            to {
                opacity: 1
            }
        }
    </style>
</head>
<body>

    <header>
        <h2>Магазин «Електрообладнання»</h2>
        <nav>
            <a href="#">Головна</a>
            <a href="#">Каталог</a>
            <a href="#">Про нас</a>
            <a href="#">Контакти</a>
        </nav>
    </header>

    <div class="slider">

        <div class="item">
            <img src="img/slide1.jpg" alt="Перший слайд">
            <div class="slideText">Модульна автоматика та щитове обладнання</div>
        </div>

        <div class="item">
            <img src="img/slide2.jpg" alt="Другий слайд">
            <div class="slideText">Кабельно-провідникова продукція</div>
        </div>

        <div class="item">
            <img src="img/slide3.jpg" alt="Третій слайд">
            <div class="slideText">Розетки, вимикачі та LED-освітлення</div>
        </div>

        <div class="item">
            <img src="img/slide4.jpg" alt="Четвертий слайд">
            <div class="slideText">Генератори та стабілізатори напруги</div>
        </div>

        <a class="prev" onclick="minusSlide()">&#10094;</a>
        <a class="next" onclick="plusSlide()">&#10095;</a>

        <div class="slider-dots">
            <span class="slider-dots_item" onclick="currentSlide(1)"></span>
            <span class="slider-dots_item" onclick="currentSlide(2)"></span>
            <span class="slider-dots_item" onclick="currentSlide(3)"></span>
            <span class="slider-dots_item" onclick="currentSlide(4)"></span>
        </div>

    </div>

    <script>
        var slideIndex = 1;
        showSlides(slideIndex);

        function plusSlide() {
            showSlides(slideIndex += 1);
        }

        function minusSlide() {
            showSlides(slideIndex -= 1);
        }

        function currentSlide(n) {
            showSlides(slideIndex = n);
        }

        function showSlides(n) {
            let i;
            let slides = document.getElementsByClassName("item");
            let dots = document.getElementsByClassName("slider-dots_item");
            if (n > slides.length) {
                slideIndex = 1;
            }
            if (n < 1) {
                slideIndex = slides.length;
            }
            for (i = 0; i < slides.length; i++) {
                slides[i].style.display = "none";
            }
            for (i = 0; i < dots.length; i++) {
                dots[i].className = dots[i].className.replace(" active", "");
            }
            slides[slideIndex - 1].style.display = "block";
            dots[slideIndex - 1].className += " active";
        }
    </script>

</body>
</html>

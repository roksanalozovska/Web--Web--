<!DOCTYPE html>
<head>
    <title>Завдання 4</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #8fa6bc;
            margin: 30px;
        }

        .form-box {
            width: 520px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 25px 45px;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            color: #1b263b;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 22px;
        }

        .row {
            margin-bottom: 10px;
            font-size: 14px;
            color: #1b263b;
        }

        input[type="text"] {
            padding: 3px 6px;
            border: 1px solid #999;
            border-radius: 2px;
        }

        hr {
            border: none;
            border-top: 2px solid #2b3d52;
            margin: 14px 0;
        }

        .radio-group {
            margin-left: 15px;
            margin-top: 5px;
            line-height: 1.6;
        }

        textarea {
            width: 240px;
            height: 45px;
            vertical-align: middle;
        }

        .error {
            color: red;
            font-size: 12px;
            display: block;
            margin-top: 2px;
        }

        .buttons {
            margin-top: 15px;
        }

        .btn {
            background-color: #36495e;
            color: #ffffff;
            border: none;
            padding: 10px 24px;
            font-size: 14px;
            cursor: pointer;
            margin-right: 5px;
        }

            .btn:hover {
                background-color: #243342;
            }
    </style>

    <script type="text/javascript">
        function validate() {
            // Очищаємо попередні повідомлення про помилки
            document.getElementById('surnamef').innerHTML = '';
            document.getElementById('namef').innerHTML = '';
            document.getElementById('emailf').innerHTML = '';
            document.getElementById('phonef').innerHTML = '';
            document.getElementById('addressf').innerHTML = '';
            document.getElementById('typef').innerHTML = '';

            // Зчитуємо значення полів форми
            let surname = document.forms['form']['surname'].value;
            let x = document.forms['form']['name'].value;
            let y = document.forms['form']['email'].value;
            let phone = document.forms['form']['phone'].value;
            let address = document.forms['form']['address'].value;

            // Перевірка прізвища
            if (surname.length == 0) {
                document.getElementById('surnamef').innerHTML = '*дане поле обов’язкове для заповнення';
                return false;
            }

            // Перевірка імені 
            if (x.length == 0) {
                document.getElementById('namef').innerHTML = '*дане поле обов’язкове для заповнення';
                return false;
            }

            // Перевірка email
            let at = y.indexOf("@");
            let dot = y.indexOf(".");
            if (at < 1 || dot < 1) {
                document.getElementById('emailf').innerHTML = '*email введено не вірно';
                return false;
            }

            // Перевірка номера телефону
            if (phone.length < 10) {
                document.getElementById('phonef').innerHTML = '*введіть коректний номер телефону';
                return false;
            }

            // Перевірка адреси
            if (address.length == 0) {
                document.getElementById('addressf').innerHTML = '*вкажіть адресу';
                return false;
            }

            alert("Форму підбору будинку успішно відправлено!");
            return true;
        }
    </script>
</head>
<body>

    <div class="form-box">
        <h2>Форма підбору будинку</h2>

        <form name="form" onsubmit="return validate()">
            <div class="row">
                Прізвище: <input type="text" name="surname" size="22">
                <span id="surnamef" class="error"></span>
            </div>

            <div class="row">
                Ім'я: <input type="text" name="name" size="22">
                <span id="namef" class="error"></span>
            </div>

            <div class="row">
                Email: <input type="text" name="email" size="22" placeholder="yourmail@gmail.com">
                <span id="emailf" class="error"></span>
            </div>

            <div class="row">
                Номер телефону: <input type="text" name="phone" size="22" placeholder="+380501234567">
                <span id="phonef" class="error"></span>
            </div>

            <div class="row">
                Адреса: <input type="text" name="address" size="22">
                <span id="addressf" class="error"></span>
            </div>

            <hr>

            <div class="row">
                Оберіть тип житла:
                <div class="radio-group">
                    <label><input type="radio" name="house_type" value="flat"> Квартира</label><br>
                    <label><input type="radio" name="house_type" value="townhouse"> Таунхаус</label><br>
                    <label><input type="radio" name="house_type" value="house"> Будинок</label>
                </div>
                <span id="typef" class="error"></span>
            </div>

            <div class="row">
                Оберіть кількість кімнат:
                <select name="rooms">
                    <option value="1">Однокімнатні</option>
                    <option value="2">Двокімнатні</option>
                    <option value="3">Трикімнатні</option>
                    <option value="4">Більше 3 кімнат</option>
                </select>
            </div>

            <hr>

            <div class="row">
                Оберіть бажану ціну:<br>
                <input type="range" name="price" min="1000" max="10000" step="100" value="3500"
                       oninput="document.getElementById('priceVal').innerHTML = this.value + '$'">
                <span id="priceVal">3500$</span>
            </div>

            <hr>

            <div class="row">
                Є домашні тварини <input type="checkbox" name="pets">
            </div>

            <div class="row">
                Додаткові побажання:
                <textarea name="wishes"></textarea>
            </div>

            <div class="buttons">
                <input type="submit" value="Відправити" class="btn">
                <input type="reset" value="Скасувати" class="btn" onclick="document.getElementById('priceVal').innerHTML='3500$'">
            </div>
        </form>
    </div>

</body>
